piwigo_display.settings:
  path: '/admin/config/media/piwigo-display'
  defaults:
    _form: '\Drupal\piwigo_display\Form\SettingsForm'
    _title: 'Piwigo Display'
  requirements:
    _permission: 'administer site configuration'

piwigo_display.thumbnail:
  path: '/piwigo-display/thumbnail/{image_id}'
  defaults:
    _controller: '\Drupal\piwigo_display\Controller\ThumbnailController::thumbnail'
  requirements:
    _permission: 'create media'
    image_id: '\d+'

piwigo_display.derivative:
  path: '/piwigo-display/media/{media}/derivative/{derivative}'
  defaults:
    _controller: '\Drupal\piwigo_display\Controller\DerivativeController::derivative'
  requirements:
    _entity_access: 'media.view'
    media: '\d+'
    derivative: 'square|thumb|xsmall|small|medium|large|xlarge|xxlarge'
  options:
    parameters:
      media:
        type: 'entity:media'
