name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Lint PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate YAML syntax
        run: ruby -e 'require "yaml"; Dir.glob("**/*.{yml,yaml}").sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'
