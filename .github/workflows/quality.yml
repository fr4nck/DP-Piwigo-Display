name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Lint PHP
        run: find . -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: node --check js/piwigo-display-library.js

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob("**/*.{yml,yaml}").sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Run Media Library form-tree regression test
        run: php tests/form_tree.php

      - name: Run Media Library slot-limit regression test
        run: php tests/media_library_slots.php

      - name: Run lazy thumbnail regression test
        run: php tests/lazy_thumbnails.php

      - name: Run thumbnail cache regression test
        run: php tests/thumbnail_cache.php

      - name: Run secret-storage regression test
        run: php tests/secret_storage.php

  drupal-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: '^10.3 <11'
            php: '8.1'
          - drupal: '^11'
            php: '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select Drupal core branch
        run: composer require --no-update "drupal/core:${{ matrix.drupal }}"

      - name: Install Drupal core
        run: composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --no-plugins --no-scripts

      - name: Show resolved Drupal version
        run: composer --no-plugins show drupal/core

      - name: Run Drupal compatibility smoke test
        run: php tests/compatibility.php

      - name: Run Piwigo origin security tests
        run: php tests/origin_security.php
