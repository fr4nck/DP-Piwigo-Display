name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'piwigo_display.info.yml'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(awk -F"'" '/^version:/ {print $2; exit}' piwigo_display.info.yml)"

          if [[ -z "$version" ]]; then
            echo "Impossible de lire la version du module dans piwigo_display.info.yml" >&2
            exit 1
          fi

          if [[ "$version" == *-dev ]]; then
            echo "Version de développement $version : aucune release à publier."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$ ]]; then
            echo "Format de version non pris en charge : $version" >&2
            exit 1
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            echo "La release $version existe déjà : ses notes seront mises à jour sans republier l’artefact."
            echo "mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "La release $version n’existe pas encore : création complète."
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Drupal module archive
        if: steps.version.outputs.mode == 'create'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix=piwigo_display/ \
            HEAD \
            -o "piwigo_display-${VERSION}.zip"

      - name: Extract release notes
        if: steps.version.outputs.mode != 'skip'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            printf 'Piwigo Display %s\n\nVoir CHANGELOG.md pour le détail.\n' "$VERSION" > release-notes.md
          fi

      - name: Publish GitHub release
        if: steps.version.outputs.mode == 'create'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          release_args=(
            "$VERSION"
            "piwigo_display-${VERSION}.zip#Module Drupal Piwigo Display"
            --target "$GITHUB_SHA"
            --title "Piwigo Display $VERSION"
            --notes-file release-notes.md
          )

          if [[ "$VERSION" =~ -(alpha|beta|rc)[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

      - name: Update existing release notes
        if: steps.version.outputs.mode == 'update'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          edit_args=(
            "$VERSION"
            --title "Piwigo Display $VERSION"
            --notes-file release-notes.md
          )

          if [[ "$VERSION" =~ -(alpha|beta|rc)[0-9]+$ ]]; then
            edit_args+=(--prerelease)
          fi

          gh release edit "${edit_args[@]}"
