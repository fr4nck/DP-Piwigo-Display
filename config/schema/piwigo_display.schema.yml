piwigo_display.settings:
  type: config_object
  label: 'Piwigo Display settings'
  mapping:
    base_url:
      type: uri
      label: 'Piwigo base URL'
    legacy_username:
      type: string
      label: 'Legacy Piwigo username'
    request_timeout:
      type: integer
      label: 'HTTP request timeout'
    cache_ttl:
      type: integer
      label: 'Metadata cache lifetime'
    default_derivative:
      type: string
      label: 'Default Piwigo derivative'
    thumbnail_derivative:
      type: string
      label: 'Thumbnail Piwigo derivative'
